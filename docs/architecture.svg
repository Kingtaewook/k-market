h="1.5" marker-end="url(#ab)"/><circle cx="150" cy="135" r="11" fill="#2f6fec"/><text x="150" y="139.5" class="bn">8</text><text x="168" y="140" class="al" text-anchor="start" fill="#2f6fec">로그인 후 표 읽기 (승인 회원만 잠금 표)</text><path d="M360,70 H625 V178" fill="none" stroke="#2f6fec" stroke-width="1.5" marker-end="url(#ab)"/><circle cx="500" cy="70" r="11" fill="#2f6fec"/><text x="500" y="74.5" class="bn">9</text><text x="518" y="62" class="al" text-anchor="start" fill="#2f6fec">10초 실시간</text><path d="M540,836 V866 H8 V80 H60" fill="none" stroke="#8a8f98" stroke-width="1.5" marker-end="url(#ag)"/><text x="16" y="880" class="al" text-anchor="start" fill="#8a8f98">사이트 열기</text><text x="30" y="912" class="h2">한 번의 흐름 (평일 기준)</text><circle cx="42" cy="938" r="11" fill="#111"/><text x="42" y="942.5" class="bn">1</text><text x="62" y="943" class="st" text-anchor="start" fill="#222">예약 작업이 매 1분 kis-market을 비밀 열쇠와 함께 부른다.</text><circle cx="42" cy="964" r="11" fill="#111"/><text x="42" y="968.5" class="bn">2</text><text x="62" y="969" class="st" text-anchor="start" fill="#222">kis-market이 한국투자증권에서 지수·환율(매분)과 전 종목 시세(5분)를 받는다.</text><circle cx="42" cy="990" r="11" fill="#111"/><text x="42" y="994.5" class="bn">3</text><text x="62" y="995" class="st" text-anchor="start" fill="#222">받은 값을 live_cache에 저장한다. 회원 수와 상관없이 증권사 호출은 그대로.</text><circle cx="42" cy="1016" r="11" fill="#111"/><text x="42" y="1020.5" class="bn">4</text><text x="62" y="1021" class="st" text-anchor="start" fill="#222">정해진 시각(06:40~20:12, 평일)에 GitHub 작업을 부른다. 주말·휴장일은 스스로 건너뜀.</text><circle cx="42" cy="1042" r="11" fill="#111"/><text x="42" y="1046.5" class="bn">5</text><text x="62" y="1047" class="st" text-anchor="start" fill="#222">GitHub 작업이 한국투자증권·DART·네이버(예비)에서 모으고 분석한다.</text><circle cx="582" cy="938" r="11" fill="#111"/><text x="582" y="942.5" class="bn">6</text><text x="602" y="943" class="st" text-anchor="start" fill="#222">공개 데이터는 data/에 커밋하고 사이트를 다시 배포한다.</text><circle cx="582" cy="964" r="11" fill="#2f6fec"/><text x="582" y="968.5" class="bn">7</text><text x="602" y="969" class="st" text-anchor="start" fill="#222">「정리」 분석과 큰 체결은 회원 전용 표에 저장한다.</text><circle cx="582" cy="990" r="11" fill="#2f6fec"/><text x="582" y="994.5" class="bn">8</text><text x="602" y="995" class="st" text-anchor="start" fill="#222">회원이 카카오로 로그인하면, 승인 상태에 따라 표를 읽는다.</text><circle cx="582" cy="1016" r="11" fill="#2f6fec"/><text x="582" y="1020.5" class="bn">9</text><text x="602" y="1021" class="st" text-anchor="start" fill="#222">화면에 보이는 30종목은 10초마다 kis-quote로 실시간 시세를 받는다.</text><text x="30" y="1080" class="h2">표시</text><path d="M90,1075 H134" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#ak)"/><text x="144" y="1080" class="st" text-anchor="start" fill="#222">자동 · 동작 확인됨</text><path d="M340,1075 H384" fill="none" stroke="#2f6fec" stroke-width="1.5" marker-end="url(#ab)"/><text x="394" y="1080" class="st" text-anchor="start" fill="#222">회원 전용(잠금) 경로</text><path d="M590,1075 H634" fill="none" stroke="#8a8f98" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#ag)"/><text x="644" y="1080" class="st" text-anchor="start" fill="#222">예비 경로</text><text x="30" y="1104" class="ft">기준: 2026-11-28. 시세 원천은 한국투자증권 하나 · 회원 화면은 저장된 표만 읽음 · 참고용 정보이며 투자 권유가 아님.</text></svg>