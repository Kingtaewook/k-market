0" class="bs">큰 체결 08:58~15:35</text><text x="590.0" y="716.0" class="bs">거래대금 상위 40종목</text><rect x="90" y="770" width="250" height="66" rx="9" fill="#fff" stroke="#111" stroke-width="1.4"/><text x="215.0" y="798.5" class="bt" fill="#111">data/ 공개 파일</text><text x="215.0" y="817.5" class="bs">종목·지표·테마·경고 · 커밋</text><rect x="420" y="770" width="240" height="66" rx="9" fill="#fff" stroke="#111" stroke-width="1.4"/><text x="540.0" y="798.5" class="bt" fill="#111">GitHub Pages</text><text x="540.0" y="817.5" class="bs">사이트 배포 (화면 코드)</text><rect x="780" y="190" width="280" height="90" rx="9" fill="#fff" stroke="#111" stroke-width="1.4"/><text x="920.0" y="222.0" class="bt" fill="#111">한국투자증권 API</text><text x="920.0" y="241.0" class="bs">REST: 시세·지수·뉴스·체결</text><text x="920.0" y="258.0" class="bs">웹소켓: 실시간 체결 (3종목)</text><rect x="780" y="353" width="280" height="80" rx="9" fill="#fff" stroke="#111" stroke-width="1.4"/><text x="920.0" y="388.5" class="bt" fill="#111">카카오</text><text x="920.0" y="407.5" class="bs">로그인</text><rect x="780" y="618" width="280" height="70" rx="9" fill="#fff" stroke="#111" stroke-width="1.4"/><text x="920.0" y="648.5" class="bt" fill="#111">OpenDART</text><text x="920.0" y="667.5" class="bs">공시 목록</text><rect x="780" y="720" width="280" height="70" rx="9" fill="#fff" stroke="#111" stroke-width="1.4" stroke-dasharray="6 5"/><text x="920.0" y="750.5" class="bt" fill="#8a8f98">네이버 금융</text><text x="920.0" y="769.5" class="bs">코스닥·환율·테마 (예비)</text><path d="M230,217 H270" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#ak)"/><circle cx="250" cy="200" r="11" fill="#111"/><text x="250" y="204.5" class="bn">1</text><path d="M400,178 V162 H840 V190" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#ak)"/><circle cx="770" cy="162" r="11" fill="#111"/><text x="770" y="166.5" class="bn">2</text><text x="788" y="155" class="al" text-anchor="start" fill="#444">시세 조회</text><path d="M700,222 H780" fill="none" stroke="#111" stroke-wi