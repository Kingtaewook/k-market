name: 주가 데이터 자동 갱신

on:
  schedule:
    # GitHub cron 은 UTC 기준(KST-9). 정각·15분 정각은 몰려서 늦어지기 쉬워 몇 분씩 비켜 둠.
    - cron: "20 23 * * 0-4"          # 08:20 KST  장 전 뉴스
    - cron: "5,20,35,50 0-5 * * 1-5" # 09:05~14:50 KST  장중 15분마다 시세
    - cron: "5,20,35 6 * * 1-5"      # 15:05~15:35 KST  장중 15분마다 시세
    - cron: "2 2 * * 1-5"            # 11:02 KST  10초 브리핑
    - cron: "47 6 * * 1-5"           # 15:47 KST  장 마감 후 전체 갱신 + 브리핑
    - cron: "12 11 * * 1-5"          # 20:12 KST  넥스트레이드(NXT) 마감 가격 + 브리핑
  workflow_dispatch: {}   # Actions 탭에서 'Run workflow' 버튼으로 수동 실행

permissions:
  contents: write
  pages: write   # 봇 커밋은 Pages 자동 배포를 깨우지 않아서, 아래에서 직접 다시 배포를 요청

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 데이터 수집
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          case "$SCHEDULE" in
            "20 23 * * 0-4") python scripts/update_data.py ;;                                         # 장 전 뉴스
            "2 2 * * 1-5")   python scripts/live_update.py --brief ;;                                 # 11시 브리핑
            "47 6 * * 1-5")  python scripts/update_data.py; python scripts/live_update.py --brief ;;  # 장 마감 전체
            "12 11 * * 1-5") python scripts/live_update.py --nxt --brief ;;                           # NXT 마감
            "")              python scripts/update_data.py; python scripts/live_update.py --brief ;;  # 수동 실행 = 전체
            *)               python scripts/live_update.py ;;                                         # 장중 15분 시세
          esac
      - name: 변경 사항 커밋
        run: |
          git config user.name "k-market-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -q -m "데이터 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            for i in 1 2 3 4 5; do
              git pull -q --rebase -X theirs origin main && git push && echo "pushed=1" >> "$GITHUB_OUTPUT" && exit 0
              echo "push 재시도 $i"; sleep $((i * 5))
            done
            exit 1
          fi
        id: commit
      - name: 사이트 다시 배포 (새 데이터 반영)
        if: steps.commit.outputs.pushed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages 재배포 요청 실패 (다음 배포 때 반영)"
