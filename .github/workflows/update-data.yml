name: 주가 데이터 자동 갱신

on:
  # 정해진 시간 실행은 GitHub 예약(cron)이 몇 시간씩 늦게 돌아서, Supabase(kis-market, 매분)가 제때 이 작업을 불러요.
  #   08:20 news · 09:05~15:35 15분마다 live · 11:02 brief · 15:47 close · 20:12 nxt  (평일)
  # Actions 탭 'Run workflow' 버튼으로 수동 실행하면 기본값 full = 전체 갱신 + 브리핑
  workflow_dispatch:
    inputs:
      mode:
        description: "full=전체 / news=장 전 뉴스 / live=시세만 / brief=11시 브리핑 / close=장 마감 / nxt=NXT 마감"
        required: false
        default: full
        type: choice
        options: [full, news, live, brief, close, nxt]

permissions:
  contents: write
  pages: write   # 봇 커밋은 Pages 자동 배포를 깨우지 않아서, 아래에서 직접 다시 배포를 요청

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 데이터 수집
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          MODE: ${{ inputs.mode || 'full' }}
          PYTHONUNBUFFERED: "1"
        run: |
          echo "실행 종류: $MODE"
          case "$MODE" in
            news)  RUN_MODE=news python scripts/update_data.py ;;                                                   # 장 전 뉴스
            live)  python scripts/live_update.py ;;                                                                 # 장중 15분 시세
            brief) python scripts/live_update.py --brief ;;                                                         # 11시 브리핑
            close) RUN_MODE=close python scripts/update_data.py; python scripts/live_update.py --brief ;;            # 장 마감 전체
            nxt)   python scripts/live_update.py --nxt --brief ;;                                                   # NXT 마감
            *)     export RUN_MODE=full; python scripts/update_data.py; python scripts/live_update.py --brief ;;    # 수동 실행 = 전체
          esac
      - name: 변경 사항 커밋
        run: |
          git config user.name "k-market-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -q -m "데이터 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            for i in 1 2 3 4 5; do
              git pull -q --rebase -X theirs origin main && git push && echo "pushed=1" >> "$GITHUB_OUTPUT" && exit 0
              echo "push 재시도 $i"; sleep $((i * 5))
            done
            exit 1
          fi
        id: commit
      - name: 사이트 다시 배포 (새 데이터 반영)
        if: steps.commit.outputs.pushed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages 재배포 요청 실패 (다음 배포 때 반영)"
