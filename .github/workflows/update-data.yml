name: 주가 데이터 자동 갱신

on:
  schedule:
    # 평일 16:20 KST (장 마감 후) — GitHub cron 은 UTC 기준
    - cron: "20 7 * * 1-5"
    # 평일 08:20 KST (장 시작 전 전날 해외 뉴스 반영)
    - cron: "20 23 * * 0-4"
  workflow_dispatch: {}   # Actions 탭에서 'Run workflow' 버튼으로 수동 실행

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 데이터 수집
        run: python scripts/update_data.py
      - name: 변경 사항 커밋
        run: |
          git config user.name "k-market-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "데이터 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            git push
          fi
