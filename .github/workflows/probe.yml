name: 데이터 구조 확인 (수동)
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests pandas lxml finance-datareader
      - run: python scripts/probe.py
      - run: |
          git config user.name "k-market-bot"; git config user.email "actions@users.noreply.github.com"
          git add probe; git commit -m "probe" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin main && git push && break; sleep 5; done
